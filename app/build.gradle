apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "ai.ophone.bridge"
        testInstrumentationRunner "ai.ophone.bridge.NativeAgentChecks"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 43
        versionName "1.10.25"
        // Address that receives feedback reports from the in-app feedback page; empty until decided.
        buildConfigField "String", "FEEDBACK_EMAIL", '"ooorrrt88@gmail.com"'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir "$buildDir/python/jniLibs"
            assets.srcDir "$buildDir/python/assets"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}

// Embedded CPython from the official python.org Android releases; see tools/python-android.
task prepareEmbeddedPython(type: Exec) {
    def script = rootProject.file('tools/python-android/prepare.py')
    inputs.file script
    inputs.file rootProject.file('tools/python-android/launcher.c')
    outputs.dir "$buildDir/python"
    commandLine(findProperty('hostPython') ?: 'python', script,
            '--sdk', android.sdkDirectory,
            '--cache', rootProject.file('.python-cache'),
            '--out', "$buildDir/python")
}
preBuild.dependsOn prepareEmbeddedPython
